# Registro de vigencia documental — fuente de autoridad del índice
#
# Este archivo simula el «registro único de vigencia documental» que ACTA-CTO-2025-11 §4.1 encarga a
# la Gerencia de Cumplimiento. Mientras ese registro no exista, la vigencia la certifica el área
# emisora a solicitud del interesado (§4.2). En el prototipo, las certificaciones son SIMULADAS por
# el equipo a partir de la evidencia del propio corpus (campo modo_certificacion). En producción,
# cada entrada la firma el área indicada en certificado_por y el índice solo la lee.
#
# Estados:
#   vigente                  el área certificó que rige
#   derogado                 hay evidencia de reemplazo o derogatoria; nunca se cita como norma
#   pendiente_certificacion  no hay evidencia de derogación, pero tampoco certificación; se cita con advertencia
#   no_normativo             actas y comunicaciones: antecedente consultable, nunca la norma

