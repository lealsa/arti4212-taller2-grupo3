    tipo: trampa_valor
    pregunta: "¿Cuál es el umbral de alarma de presión en el tramo Ayacucho – Coveñas?"
    hechos: ["1.100"]
    prohibidos: ["1.200", "1.250", "1.240"]
    fuentes: [{codigo: PRO-OPE-012, version: "3", seccion: "3"}]
    nota: "Cuatro cifras parecidas en el corpus: 1.100 vigente, 1.200 derogado, 1.250 MAOP, 1.240 alarma de la P-101."

