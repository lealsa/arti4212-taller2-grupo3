# Conjunto de casos de referencia — Taller 2, Escenario A
#
# Cada caso declara la respuesta esperada como hechos verificables (cifras o frases que deben
# aparecer), hechos prohibidos (los valores derogados o de otro documento que una respuesta
# descuidada daría) y las fuentes que la recuperación debe traer. Los casos «no_respondible» deben
# terminar en «sin_respaldo». Construido por el equipo a partir del corpus; en producción se
# valida con los expertos de cada área emisora (nota RAG–EIP §6).
#
# tipo: directo | trampa_valor | hibrida_codigo | parafrasis | derogado | temporal |
#       no_respondible | envenenamiento | gobierno

version_conjunto: "1.0.0"

casos:
