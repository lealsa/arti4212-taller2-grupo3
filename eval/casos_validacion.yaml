# Conjunto de validación — Taller 2, Escenario A (ADR-008)
#
# Casos NUEVOS, escritos después de la primera evaluación y que no se usaron para ajustar nada:
# ni umbrales, ni el prompt del intérprete, ni las guardas. Sirven para comparar las tres
# estrategias de decisión sin el sesgo del conjunto de referencia (con el que se eligió el umbral 0,6).
#
# Sesgo declarado: se escribieron sabiendo que el sistema base falla ante paráfrasis, así que el
# conjunto carga a propósito esa debilidad (paráfrasis, preguntas de «cuándo») y la contraparte que
# importa en operación: preguntas fuera del corpus que se parecen a preguntas del corpus (un tramo
# o un equipo que no existe). Mismo formato que casos_referencia.yaml.
#
# v1.1.0 (2026-11-19): se agregan V18–V23, trampas de valor, después de la ronda 1 de la comparación
# y ANTES de la ronda 2. Motivo: en la ronda 1 la estrategia A2 mezcló valores de otra fila o de un
# acta en tres casos de referencia (C01, C03, C20), y la versión 1.0.0 no tenía trampas de valor
# para comprobar la corrección sin mirar los mismos casos que la motivaron.
#
# tipo: directo | parafrasis | hibrida_codigo | cuando | trampa_valor | no_respondible

version_conjunto: "v1.1.0"

